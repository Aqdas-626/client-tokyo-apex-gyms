<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="gradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="gradAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#3b82f6" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Shield / Hexagon -->
  <polygon points="100,12 182,56 182,144 100,188 18,144 18,56" fill="url(#gradPrimary)" stroke="#1e293b" stroke-width="4" filter="url(#glow)"/>
  
  <!-- Subtle Inner Border -->
  <polygon points="100,24 170,62 170,138 100,176 30,138 30,62" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Mountain Peak / Apex Symbol -->
  <path d="M100 45 L135 105 L118 105 L100 75 L82 105 L65 105 Z" fill="url(#gradAccent)" />

  <!-- Dumbbell / Barbell Bar -->
  <rect x="52" y="118" width="96" height="8" rx="4" fill="#f8fafc" />

  <!-- Left Dumbbell Plates -->
  <rect x="46" y="106" width="7" height="32" rx="3.5" fill="url(#gradAccent)" />
  <rect x="37" y="111" width="6" height="22" rx="3" fill="#cbd5e1" />

  <!-- Right Dumbbell Plates -->
  <rect x="147" y="106" width="7" height="32" rx="3.5" fill="url(#gradAccent)" />
  <rect x="157" y="111" width="6" height="22" rx="3" fill="#cbd5e1" />

  <!-- Center Knurling Grips -->
  <rect x="88" y="116" width="24" height="12" rx="2" fill="#94a3b8" opacity="0.6"/>

  <!-- Tokyo Star Accent -->
  <circle cx="100" cy="148" r="3.5" fill="#f59e0b" />
  <path d="M100 141 L102 146 L107 148 L102 150 L100 155 L98 150 L93 148 L98 146 Z" fill="url(#gradAccent)" />

  <!-- Subtitle Text -->
  <text x="100" y="168" font-family="'Inter', -apple-system, sans-serif" font-size="10" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="3">TOKYO APEX</text>
</svg>
